<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Clínica Marcela & Rafaela</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar com três "consultórios" (Clínica, Dra. Marcela, Dra. Rafaela), cada um com sua cor; conteúdo em painéis */
:root{
  --bg:#F4F5F3; --surface:#FFFFFF; --sunk:#ECEEEB; --ink:#1E1D20; --muted:#6B6A70; --line:#DCDEDA;
  --marcela:#8E5458; --marcela-soft:#F3E7E7;
  --rafaela:#3C7468; --rafaela-soft:#E3F0EC;
  --clinica:#3D4B63; --clinica-soft:#E5E9F0;
  --ok:#2F7D4F; --ok-soft:#E2F2E8; --warn:#A86A12; --warn-soft:#FBF0DC; --bad:#B03A3A; --bad-soft:#F8E3E3;
  --display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141416; --surface:#1C1C1F; --sunk:#232327; --ink:#ECEBEE; --muted:#A2A1A8; --line:#313136;
  --marcela:#D4999C; --marcela-soft:#3A2729; --rafaela:#86C2B4; --rafaela-soft:#1F3330; --clinica:#9FB0CC; --clinica-soft:#262D3A;
  --ok:#6FC891; --ok-soft:#1D3326; --warn:#E3AE5C; --warn-soft:#3A2E1A; --bad:#EA8B8B; --bad-soft:#3D2222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1C1C1F; --sunk:#232327; --ink:#ECEBEE; --muted:#A2A1A8; --line:#313136;
  --marcela:#D4999C; --marcela-soft:#3A2729; --rafaela:#86C2B4; --rafaela-soft:#1F3330; --clinica:#9FB0CC; --clinica-soft:#262D3A;
  --ok:#6FC891; --ok-soft:#1D3326; --warn:#E3AE5C; --warn-soft:#3A2E1A; --bad:#EA8B8B; --bad-soft:#3D2222; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 10px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand b{font-family:var(--display);font-size:24px;font-weight:600;display:block;line-height:1.1}
.brand span{color:var(--muted);font-size:12px}
.grp{margin:14px 0 4px;padding:0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;align-items:center;gap:8px}
.grp i{width:8px;height:8px;border-radius:50%;display:inline-block}
nav button{all:unset;display:block;width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink);font-weight:500}
nav button:hover{background:var(--sunk)}
nav button:focus-visible{outline:2px solid var(--clinica);outline-offset:1px}
nav button.on{background:var(--sunk);font-weight:700}
nav button.on[data-c="marcela"]{background:var(--marcela-soft);color:var(--marcela)}
nav button.on[data-c="rafaela"]{background:var(--rafaela-soft);color:var(--rafaela)}
nav button.on[data-c="clinica"]{background:var(--clinica-soft);color:var(--clinica)}
.demo{margin:20px 10px 0;font-size:12px;color:var(--muted);background:var(--sunk);padding:10px;border-radius:8px}
main{padding-block:26px 60px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px));min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.05;margin:2px 0 0;text-wrap:balance}
h1 em{font-weight:500}
h2{font-size:15px;margin:0 0 12px;font-weight:700}
h3{font-size:13px;margin:0 0 8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.c-marcela{color:var(--marcela)} .c-rafaela{color:var(--rafaela)} .c-clinica{color:var(--clinica)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px} .kpi .s{font-size:12px;color:var(--muted)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 14px;border-radius:8px;font-weight:600;background:var(--ink);color:var(--bg);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--clinica);outline-offset:2px}
.btn.marcela{background:var(--marcela);color:#fff} .btn.rafaela{background:var(--rafaela);color:#fff}
:root[data-theme="dark"] .btn.marcela,:root[data-theme="dark"] .btn.rafaela{color:#141416}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.marcela,:root:not([data-theme="light"]) .btn.rafaela{color:#141416}}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-m{background:var(--marcela-soft);color:var(--marcela)} .p-r{background:var(--rafaela-soft);color:var(--rafaela)} .p-c{background:var(--clinica-soft);color:var(--clinica)} .p-n{background:var(--sunk);color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.time{font-variant-numeric:tabular-nums;font-weight:700;min-width:46px}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%}
.payrow{display:grid;grid-template-columns:120px 1fr 96px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.tabs{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button:focus-visible{outline:2px solid var(--clinica)}
/* agenda */
.week{display:grid;grid-template-columns:52px repeat(6,minmax(110px,1fr));min-width:760px}
.week .hd{font-size:12px;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.week .hd.today{color:var(--accent)}
.week .hr{font-size:11px;color:var(--muted);text-align:right;padding-right:8px;height:52px;border-top:1px solid var(--line);transform:translateY(-7px);border-top-color:transparent}
.week .col{position:relative;border-left:1px solid var(--line)}
.week .slot{height:52px;border-top:1px solid var(--line)}
.ev{position:absolute;left:4px;right:4px;border-radius:7px;padding:5px 7px;font-size:11.5px;line-height:1.3;overflow:hidden;cursor:pointer;border-left:3px solid var(--accent);background:var(--accent-soft)}
.ev b{display:block;font-size:12px}
.ev.cir{background:var(--accent);color:var(--surface);border-left-color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* cirurgia */
.surg{display:flex;flex-direction:column;gap:8px}
.scard{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:12px;display:block;background:var(--surface)}
.scard:hover{border-color:var(--marcela)} .scard.on{border-color:var(--marcela);box-shadow:inset 3px 0 0 var(--marcela)}
.scard:focus-visible{outline:2px solid var(--marcela)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.check{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13px}
.check input{margin-top:3px;accent-color:var(--marcela)}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .st{position:relative;padding:5px 0 10px}
.tl .st::before{content:"";position:absolute;left:-19px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl .st.done::before{background:var(--marcela);border-color:var(--marcela)}
.tl .st.next::before{border-color:var(--marcela)}
.team{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;font-size:12.5px}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--sunk)}
/* paciente */
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.search:focus{outline:2px solid var(--clinica);outline-offset:-1px}
.alert{background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600}
.note{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,20,24,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;width:min(520px,100%);max-height:90vh;overflow-y:auto;padding:22px;border:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.f input,.f select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.f input:focus,.f select:focus{outline:2px solid var(--clinica);outline-offset:-1px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:60}

.fichagrid{grid-template-columns:240px minmax(0,1fr)}
.plist{padding:12px;align-self:start;position:sticky;top:16px}
.prow{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;width:100%}
.prow:hover{background:var(--sunk)} .prow.on{background:var(--clinica-soft)} .prow:focus-visible{outline:2px solid var(--clinica)}
.prow b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av.big{width:54px;height:54px;font-size:18px;font-family:var(--display);font-weight:600;background:var(--clinica-soft);color:var(--clinica)}
.fname{font-family:var(--display);font-size:30px;font-weight:600;margin:0;line-height:1.1}
.fstrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);align-items:center}
.tagline{background:var(--sunk);padding:6px 10px;border-radius:8px;font-size:13px}
.tagline .muted{font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-right:6px;font-weight:700}
.fstrip .alert{padding:6px 10px}
.pin{background:var(--warn-soft);color:var(--warn);padding:6px 6px 6px 10px;border-radius:8px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.pin .x{all:unset;cursor:pointer;padding:0 5px;border-radius:4px;opacity:.7} .pin .x:hover{opacity:1} .pin .x:focus-visible{outline:2px solid var(--warn)}
.addpin{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:6px 10px;border:1px dashed var(--line);border-radius:8px}
.addpin:hover{color:var(--ink)} .addpin:focus-visible{outline:2px solid var(--clinica)}
.ftabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.ftabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ftabs button.on{color:var(--ink);border-bottom-color:var(--ink)} .ftabs button:focus-visible{outline:2px solid var(--clinica)}
.cnt{background:var(--sunk);border-radius:99px;padding:0 7px;font-size:11px;margin-left:4px}
.editor{border-top:3px solid var(--ac)}
.f textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.f textarea:focus{outline:2px solid var(--ac,var(--clinica));outline-offset:-1px}
.evo{border-left:3px solid var(--ac);padding:12px 0 12px 14px;margin-top:12px}
.evo+.evo{border-top:0}
.evo-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.evo-b{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;margin:10px 0 0;font-size:13.5px}
.evo-b dt{color:var(--muted);font-size:12px;font-weight:700;padding-top:1px} .evo-b dd{margin:0;max-width:68ch}
.meds{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;background:var(--sunk);padding:6px 10px;border-radius:8px;width:fit-content;max-width:100%}
.evo-a{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.att{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--surface)}
.att::before{content:"⎘ ";color:var(--muted)}
.lnk{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:2px} .lnk:focus-visible{outline:2px solid var(--clinica)}
.tl2{display:flex;flex-direction:column}
.tli{display:flex;gap:12px;align-items:baseline;padding:9px 0 9px 12px;border-left:3px solid var(--ac);border-bottom:1px solid var(--line);font-size:13.5px}
.tli.fut{border-left-style:dashed;background:var(--sunk)}
.tld{font-weight:700;min-width:42px}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px;border:1.5px dashed var(--line);border-radius:10px;cursor:pointer;text-align:center;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--clinica);background:var(--clinica-soft)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.dcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;align-items:flex-start;min-width:0}
.dcard:hover{border-color:var(--ink)} .dcard:focus-visible{outline:2px solid var(--clinica)}
.thumb{width:48px;height:56px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.05em;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.t-m{background:var(--marcela-soft);color:var(--marcela)} .t-r{background:var(--rafaela-soft);color:var(--rafaela)}
.dmeta{display:flex;flex-direction:column;min-width:0} .dmeta b{font-size:13px;overflow-wrap:anywhere}
.preview{margin-top:14px;min-height:260px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.preview img{max-height:70vh;width:auto}
@media (max-width:1000px){.fichagrid{grid-template-columns:1fr}.plist{position:static}.plist .list{flex-direction:row;overflow-x:auto;gap:4px}.prow{width:auto;flex:none}}
@media (max-width:520px){.evo-b{grid-template-columns:1fr}.evo-b dt{margin-top:4px}}
.pbtn{all:unset;cursor:pointer;display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}.pbtn:focus-visible{outline:2px solid var(--clinica)}
.li.click{cursor:pointer;border-radius:6px}.li.click:hover{background:var(--sunk)}
.mobnav{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr} aside{display:none}
  .mobnav{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .mobnav select{width:100%;font:inherit;font-weight:600;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  main{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}

}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr 1fr}.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}.payrow{grid-template-columns:90px 1fr 80px}h1{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="mobnav"><label for="mob" class="small muted">Ir para</label><select id="mob"></select></div>
<div class="app">
  <aside>
    <div class="brand"><b>Clínica</b><span>Dra. Marcela Corrêa · Dra. Rafaela Tridapalli</span></div>
    <nav id="nav"></nav>

  </aside>
  <main id="view"></main>
</div>
<div id="layer"></div>

<script>

const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dfmt = d => d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D = (m,d)=>new Date(2026,m-1,d);

const DOCS = {
  marcela:{nome:'Dra. Marcela Corrêa',esp:'Cirurgia Plástica',cls:'marcela'},
  rafaela:{nome:'Dra. Rafaela Tridapalli',esp:'Prevenção e Nutrologia',cls:'rafaela'}
};

/* ---------- dados de exemplo ---------- */
const PAC = [

function tabHist(p,ev,docs){
 const itens=[];
 ev.forEach(e=>itens.push({d:e.data.slice(0,5),k:'Consulta',t:e.tipo,m:e.med}));
 p.linha.filter(l=>/agendada|prevista/i.test(l[2])).forEach(l=>itens.push({d:l[0],k:'Agendado',t:l[2],m:l[1],fut:true}));
 docs.filter(d=>d.data!=='—').forEach(d=>itens.push({d:d.data,k:'Documento',t:d.n,m:d.med}));
 [...REC.marcela.map(r=>({...r,m:'marcela'})),...REC.rafaela.map(r=>({...r,m:'rafaela'}))].filter(r=>r.pac===p.nome).forEach(r=>itens.push({d:r.data,k:'Pagamento',t:`${r.serv} · ${brl(r.valor)} (${FORMAS[r.forma]}${r.forma==='parcelado'?' '+r.parc+'x':''})`,m:r.m}));
 const key=s=>{const [d,m]=s.split('/').map(Number);return m*100+d};
 itens.sort((a,b)=>key(b.d)-key(a.d));
 const kc={Consulta:'p-n',Agendado:'p-c',Documento:'p-n',Pagamento:'p-ok'};
 return `<div class="panel"><h2>Tudo o que aconteceu com ${p.nome.split(' ')[0]}</h2>
  <div class="tl2">${itens.map(i=>`<div class="tli ${i.fut?'fut':''}" style="--ac:var(--${i.m})"><span class="num tld">${i.d}</span><div style="flex:1;min-width:0"><span class="pill ${kc[i.k]}">${i.k}</span> ${esc(i.t)}</div><span class="small muted">${i.m==='marcela'?'Marcela':'Rafaela'}</span></div>`).join('')}</div></div>`;
}

function lerArquivos(files,cb){
 const arr=[...files];let n=arr.length;const out=[];
 if(!n)return;
 arr.forEach(f=>{const item={n:f.name,info:(f.size/1024>1024?(f.size/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(f.size/1024))+' KB')};
  if(f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{item.src=r.result;out.push(item);if(!--n)cb(out)};r.onerror=()=>{out.push(item);if(!--n)cb(out)};r.readAsDataURL(f)}
  else{out.push(item);if(!--n)cb(out)}});
}

/* ---------- painel ---------- */
const hhmm=h=>`${String(Math.floor(h)).padStart(2,'0')}:${String(Math.round(h%1*60)).padStart(2,'0')}`;
const kTag={con:'Consulta',proc:'Procedimento',ret:'Retorno',cir:'Cirurgia'};
const ddmm=s=>{const [d,m]=s.split('/').map(Number);return new Date(2026,m-1,d)};
function statusPill(s){return `<span class="pill ${s==='Confirmada'?'p-ok':s==='Pendências'?'p-warn':'p-n'}">${s}</span>`}
function vPainel(){
 const hoje=d=>AG[d].map((e,i)=>({...e,i})).filter(e=>e.d===4).sort((a,b)=>a.h-b.h);
 const col=d=>`<div class="panel"><h2 class="c-${d}">${DOCS[d].nome}</h2><div class="list">${hoje(d).map(e=>`<div class="li click" data-ev="${d}:${e.i}"><span class="time">${hhmm(e.h)}</span><div style="flex:1;min-width:0"><b>${esc(e.p)}</b><div class="small muted">${esc(e.t)}</div></div><span class="pill ${e.k==='cir'?'p-'+d[0]:'p-n'}">${kTag[e.k]}</span></div>`).join('')||'<p class="muted">Nenhum horário hoje.</p>'}</div></div>`;
 const recM=REC.marcela.reduce((s,r)=>s+r.valor,0), recR=REC.rafaela.reduce((s,r)=>s+r.valor,0);
 const despAberto=DESP.filter(d=>d[4]!=='pago').reduce((s,d)=>s+d[2],0);
 const fut=CIR.filter(c=>c.data>=TODAY).sort((a,b)=>a.data-b.data);
 const prox=fut.slice(0,4), p1=fut[0];
 const avisos=[];
 fut.filter(c=>(c.data-TODAY)/864e5<=21).forEach(c=>{const f=c.pre.filter(x=>!x[1]).map(x=>x[0]);if(f.length)avisos.push(['p-bad','Pré-op',`${c.proc} de ${pacBy(c.pac).nome} (${dfmt(c.data)}): falta ${f.join(', ').toLowerCase()}.`,`data-gocir="${c.id}"`])});
 PAC.filter(p=>!p.lgpd).forEach(p=>avisos.push(['p-warn','LGPD',`${p.nome} ainda não assinou o consentimento de uso de dados e imagens.`,`data-openpac="${p.id}"`]));
 const av=DESP.filter(d=>d[4]!=='pago');if(av.length)avisos.push(['p-warn','A pagar',`${av.length} contas da clínica em aberto, somando ${brl(av.reduce((s,d)=>s+d[2],0))}.`,`data-go="fin-clinica"`]);
 const ret=ACOMP.filter(a=>{try{const d=ddmm(a.prox);return d>TODAY&&(d-TODAY)/864e5<=7}catch(e){return false}});if(ret.length)avisos.push(['p-c','Retornos',`${ret.length} pacientes da Dra. Rafaela com retorno nos próximos 7 dias.`,`data-go="acomp"`]);
 return head('Sexta, 16 de outubro','clinica','Painel do <em>dia</em>')+
 `<div class="grid g4" style="margin-bottom:16px">
  <div class="panel kpi"><div class="l">Atendimentos hoje</div><div class="v">${hoje('marcela').length+hoje('rafaela').length}</div><div class="s">${hoje('marcela').length} Dra. Marcela · ${hoje('rafaela').length} Dra. Rafaela</div></div>
  <div class="panel kpi"><div class="l">Próxima cirurgia</div><div class="v">${p1?dfmt(p1.data):'—'}</div><div class="s">${p1?esc(p1.proc)+' · '+esc(pacBy(p1.pac).nome):'nenhuma agendada'}</div></div>
  <div class="panel kpi"><div class="l">Faturado em outubro</div><div class="v">${brl(recM+recR)}</div><div class="s">soma das duas médicas</div></div>
  <div class="panel kpi"><div class="l">Contas da clínica a pagar</div><div class="v">${brl(despAberto)}</div><div class="s">até o fim do mês</div></div>
 </div>
 <div class="grid g2" style="margin-bottom:16px">${col('marcela')}${col('rafaela')}</div>
 <div class="grid g2">
  <div class="panel"><h2>Próximas cirurgias</h2><div class="list">${prox.map(c=>`<div class="li click" data-gocir="${c.id}"><span class="time">${dfmt(c.data)}</span><div style="flex:1;min-width:0"><b>${esc(c.proc)}</b><div class="small muted">${esc(pacBy(c.pac).nome)} · ${c.localTipo==='Clínica'?'na clínica':'hospital'} · ${c.hora}</div></div>${statusPill(c.status)}</div>`).join('')||'<p class="muted">Nenhuma cirurgia agendada.</p>'}</div></div>
  <div class="panel"><h2>Avisos</h2><div class="list">${avisos.map(a=>`<div class="li click" ${a[3]}><span class="pill ${a[0]}">${a[1]}</span><div>${esc(a[2])}</div></div>`).join('')||'<p class="muted">Tudo em dia.</p>'}</div></div>
 </div>`;
}

/* ---------- agenda ---------- */
let agView='semana', agDia=4;
const DIAS=['Seg 12','Ter 13','Qua 14','Qui 15','Sex 16','Sáb 17'];
function vAgenda(doc){
 const H0=7,H1=19,PX=52, hrs=[];for(let h=H0;h<H1;h++)hrs.push(h);
 const evs=AG[doc].map((e,i)=>({...e,i}));
 let html;
 if(agView==='semana'){
  html=`<div class="tablewrap"><div class="week" style="--accent:var(--${doc});--accent-soft:var(--${doc}-soft)"><div></div>${DIAS.map((d,i)=>`<div class="hd ${i===4?'today':''}">${d}${i===4?' · hoje':''}</div>`).join('')}<div>${hrs.map(h=>`<div class="hr">${h}h</div>`).join('')}</div>`;
  for(let d=0;d<6;d++) html+=`<div class="col">${hrs.map(()=>'<div class="slot"></div>').join('')}${evs.filter(e=>e.d===d).map(e=>`<div class="ev ${e.k==='cir'?'cir':''}" data-ev="${doc}:${e.i}" style="top:${(e.h-H0)*PX+2}px;height:${e.du*PX-4}px" title="${esc(e.t+' · '+e.p)}"><b>${esc(e.p)}</b>${esc(e.t)}</div>`).join('')}</div>`;
  html+='</div></div>';
 } else {
  const dia=evs.filter(e=>e.d===agDia).sort((a,b)=>a.h-b.h);
  const livres=[];for(let h=8;h<18;h++){if(h===12)continue;if(!dia.some(e=>h<e.h+e.du&&h+1>e.h))livres.push(h)}
  html=`<div class="tabs" style="margin-bottom:14px">${DIAS.map((d,i)=>`<button data-agdia="${i}" class="${agDia===i?'on':''}">${d}</button>`).join('')}</div>
   <div class="grid g-side" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)"><div class="list">${dia.map(e=>`<div class="li click" data-ev="${doc}:${e.i}" style="border-left:3px solid var(--${doc});padding-left:12px"><span class="time">${hhmm(e.h)}</span><div style="flex:1;min-width:0"><b>${esc(e.p)}</b><div class="small muted">${esc(e.t)} · ${e.du>=1?e.du+'h':Math.round(e.du*60)+' min'}</div></div><span class="pill ${e.k==='cir'?'p-'+doc[0]:'p-n'}">${kTag[e.k]}</span></div>`).join('')||'<p class="muted">Nenhum horário marcado neste dia.</p>'}</div>
   <div><h3>Horários livres</h3><div style="display:flex;flex-wrap:wrap;gap:6px">${livres.map(h=>`<button class="addpin" data-act="agendar" data-med="${doc}" data-h="${h}">${String(h).padStart(2,'0')}:00</button>`).join('')||'<span class="muted">Dia cheio</span>'}</div></div></div>`;
 }
 const extra = doc==='marcela'

/* ---------- financeiro médica ---------- */
function liquido(r){return r.valor*(1-taxa(r.forma,r.parc)/100)}
function parcelasFuturas(doc){
 const meses={};
 REC[doc].forEach(r=>{
  const [d,m]=r.data.split('/').map(Number);
  const n=r.forma==='parcelado'?r.parc:1;
  if(r.forma==='pix'||r.forma==='dinheiro')return;
  for(let i=0;i<n;i++){
   const dt=new Date(2026,m-1+(r.forma==='debito'?0:i+1),d);
   if(r.forma==='debito')dt.setDate(dt.getDate()+1);
   if(dt<=TODAY)continue;
   const k=dt.getFullYear()*100+dt.getMonth();
   meses[k]=(meses[k]||0)+liquido(r)/n;
  }
 });
 return Object.entries(meses).sort((a,b)=>a[0]-b[0]).map(([k,v])=>[new Date(Math.floor(k/100),k%100,1),v]);
}
function vFin(doc){
 CUSTOS[doc].forEach(c=>{if(c[1]==='Clínica')c[2]=(FOLHA.reduce((s,f)=>s+f[3],0)+DESP.reduce((s,d)=>s+d[2],0))/2});

 const custos=CUSTOS[doc].reduce((s,c)=>s+c[2],0);
 const fut=parcelasFuturas(doc), aReceber=fut.reduce((s,f)=>s+f[1],0);

  </tbody></table></div>`;
 if(tab==='parc'){const mx=Math.max(...fut.map(f=>f[1]),1);body=`<p class="small muted" style="margin-top:0">Parcelas de cartão que ainda vão cair na conta, já descontada a taxa da maquininha.</p>${fut.map(([d,v])=>`<div class="payrow"><span>${d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</span><div class="bar"><span style="width:${v/mx*100}%;background:var(--${doc})"></span></div><b class="num" style="text-align:right">${brl(v)}</b></div>`).join('')}`}
 if(tab==='cust') body=`<div class="tablewrap"><table><thead><tr><th>Descrição</th><th>Tipo</th><th>Situação</th><th class="r">Valor</th></tr></thead><tbody>${CUSTOS[doc].map((c,i)=>`<tr><td>${c[0]}</td><td><span class="pill ${c[1]==='Clínica'?'p-c':'p-n'}">${c[1]}</span></td><td><button class="pill pbtn ${c[3]==='pago'?'p-ok':'p-warn'}" data-custo="${doc}:${i}" title="Clique para alterar">${c[3]}</button></td><td class="r">${brl(c[2])}</td></tr>`).join('')}</tbody></table></div>`;
 return head(DOCS[doc].nome+' · financeiro próprio',doc,'Financeiro <em>· outubro</em>',`<button class="btn ${doc}" data-novo="${doc}">+ Registrar recebimento</button>`)+
 `<div class="grid g4" style="margin-bottom:16px">

  <div class="panel kpi"><div class="l">Taxas de cartão</div><div class="v">${brl(tx)}</div><div class="s">${(tx/bruto*100).toFixed(1).replace('.',',')}% do faturado</div></div>

}

 L.innerHTML=`<div class="ov" data-close><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">

  <form id="fn" class="grid" style="gap:12px">

 const upd=()=>{

  if(fo==='credito')txt+='<br>Crédito à vista: cai em 30 dias.';

 };
 L.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',upd));upd();

function agendar(doc,h){
 const nomes=PAC.filter(p=>p.medicas.includes(doc)).map(p=>p.nome);

function restore(json){
 const s=JSON.parse(json);
 const arr=(a,b)=>a.splice(0,a.length,...b), obj=(a,b)=>{Object.keys(a).forEach(k=>delete a[k]);Object.assign(a,b)};
 arr(PAC,s.PAC);arr(CIR,s.CIR.map(c=>({...c,data:new Date(c.data)})));obj(AG,s.AG);REC=s.REC;obj(CUSTOS,s.CUSTOS);arr(ACOMP,s.ACOMP);arr(FOLHA,s.FOLHA);arr(DESP,s.DESP);obj(EVOL,s.EVOL);obj(DOCSPAC,s.DOCSPAC);obj(PINS,s.PINS);obj(PROX,s.PROX);
}

 pendAnexos=[];evolFiltro='todas';render();toast('Evolução salva na ficha');
});
function addDocs(files){lerArquivos(files,out=>{const tp=(document.getElementById('d-tipo')||{}).value||'Outro';out.forEach(a=>DOCSPAC[selPac].unshift({...a,tipo:a.src&&tp==='Outro'?'Foto':tp,data:'16/10',med:autor}));docFiltro='Todos';render();toast(out.length>1?out.length+' arquivos anexados':'Arquivo anexado')})}
V.addEventListener('dragover',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over')}});
V.addEventListener('dragleave',e=>{const d=e.target.closest('.drop');if(d)d.classList.remove('over')});
V.addEventListener('drop',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();addDocs(e.dataTransfer.files)}});
V.addEventListener('change',e=>{
 if(e.target.id==='d-file'){addDocs(e.target.files);return}
 if(e.target.id==='e-file'){lerArquivos(e.target.files,out=>{pendAnexos=out;const fn=document.getElementById('e-fn');if(fn)fn.textContent=' · '+out.map(o=>o.n).join(', ')});return}
if(e.target.dataset.pre!==undefined){const c=CIR.find(x=>x.id===selCir);c.pre[+e.target.dataset.pre][1]=e.target.checked;c.status=c.pre.every(x=>x[1])?'Confirmada':'Pendências';render()}});
V.addEventListener('input',e=>{if(e.target.id==='q'){pacQ=e.target.value;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(pacQ.length,pacQ.length)}});
function render(){
 save();
 document.getElementById('nav').innerHTML=navHTML(); mob.value=route;
 V.innerHTML=({painel:vPainel,pacientes:vPacientes,'fin-clinica':vFinClinica,'ag-marcela':()=>vAgenda('marcela'),cirurgias:vCirurgias,'fin-marcela':()=>vFin('marcela'),'ag-rafaela':()=>vAgenda('rafaela'),acomp:vAcomp,'fin-rafaela':()=>vFin('rafaela')}[route]||vPainel)();
}
load();route='painel';
render();
</script>
